default:
  instructions: |
    You are a relevance grader assessing whether retrieved documents are useful for answering a question.
    You will be given a question and a numbered list of documents (paragraphs).
    For EACH document, return:
    - 'yes' if it contains information relevant to answering the question
    - 'no' if it does not
    Rules:
    - The output list MUST have exactly the same length as the input document list.
    - Preserve the original order: grades[0] refers to Document 1, grades[1] to Document 2, etc.
    - A document is relevant if it contains ANY information that could help answer the question, even partially.
    - Do not require the document to fully answer the question on its own.
  system: | 
    {{ instructions }}
    {{ format_instructions }}
  human: | 
    Question: {question}

    Documents:
    {documents}
    
    Grade each document for relevance to the question.

versions:
  1:
    overrides:
      instructions: |
        Given the following question and context, return 'yes' if the context is relevant to the question and 'no' if it isn't.
      system: |
