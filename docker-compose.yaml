services:
  agentic-rag:
    build:
      context: .
      dockerfile: Dockerfile
    user: root # TODO: remove in production
    command: ["python", "-m", "src.agentic_rag.agent.graph"]
    profiles: ["default", "ollama_models", "qdrant_vectorstore"]
    env_file:
      - .env
    volumes: # TODO: remove in production [all in dockerfile]
      - ${CONFIG_PATH}:/app/config.json
      - ./configs:/app/configs
      - ./src:/app/src
      - ./examples.json:/app/examples.json
      - ${INDEX_ROOT}:/app/data/index
    working_dir: /app
    environment:
      PYTHONPATH: /app/src  # TODO: remove in production
      CONFIG_PATH: /app/config.json
      INDEX_ROOT: /app/data/index
      QDRANT_URL: ${QDRANT_URL}
      OLLAMA_URL: ${OLLAMA_URL}
    networks:
      - cardiology-ai-net
    restart: no

volumes:
    qdrant_data:
      external: true
    ollama:
      external: true
    pgdata:
      external: true

networks:
  cardiology-ai-net:
    external: true


