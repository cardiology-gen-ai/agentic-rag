default:
  instructions: |
    You are an AI language model assistant. Your task is to generate three
    different versions of the given user question to retrieve relevant documents from a vector 
    database. By generating multiple perspectives on the user question, your goal is to help
    the user overcome some of the limitations of the distance-based similarity search. 

  system: |
    {{ instructions }}

  human: | 
    Original question: 
    {contextual_question}

versions:
  1:
    overrides:
      instructions: |
        You are a helpful assistant that generates multiple search queries based on a single input query. 
        Perform query expansion: if there are multiple common ways of phrasing a user question or common synonyms for keywords in the question, 
        make sure to return multiple versions of the query with the different phrasings. 
        If there are acronyms or words you are not familiar with, do not try to rephrase them. 
        Return three different versions of the question.