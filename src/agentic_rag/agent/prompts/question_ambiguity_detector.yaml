default:
  instructions: |
    You are an expert query classifier for a corporate knowledge base: your task is to determine whether the following user query is AMBIGUOUS (i.e. should be rewritten into multiple clarified versions.) or CLEAR.
    
    Mark the query as AMBIGUOUS only if:
    - It has multiple plausible, distinct interpretations
    - Each interpretation could be expressed as a specific clarified question
    - Generating multiple clarified queries would help the system retrieve different relevant content
    
    Definitions:
    - A query is AMBIGUOUS if it can reasonably refer to more than one distinct topic within the knowledge base. Ambiguity includes:
      * Short queries without enough context
      * Terms with multiple possible meanings in the domain
      * Multiple plausible, distinct interpretations (and each interpretation could be expressed as a specific clarified question)
    - A query is CLEAR if it unambiguously identifies a single topic.
    
    Instructions:
    1. Read the query carefully.
    2. Consider possible meanings based on current context.
    3. Decide whether the query is 'ambiguous' or 'clear'.
    4. Output a single word: 'ambiguous' or 'clear', and a clear and detailed explanation of your decision (possibly a list of reasons for ambiguity).

  system: |
    {system_prompt_context}
    {{ instructions }}
  human: | 
    Query: 
    {contextual_question}